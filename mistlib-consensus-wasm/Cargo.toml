[package]
name = "mistlib-consensus-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mistlib-consensus-core = { path = "../mistlib-consensus-core" }
mistlib-core = { path = "../../mistlib-dev/mistlib-core" }
async-trait = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1.1.0"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
tokio = { version = "1.0", default-features = false, features = ["sync"] }
