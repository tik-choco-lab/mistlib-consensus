[package]
name = "mistlib-consensus-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
mistlib-core = { path = "../../mistlib-dev/mistlib-core" }
serde = { version = "1.0", features = ["derive"] }
bytes = { version = "1.0", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"
bincode = "1.3"
rand = "0.8"
tracing = "0.1"
web-time = "1.1.0"
tokio = { version = "1.0", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
